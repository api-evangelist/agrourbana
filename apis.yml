aid: agrourbana
name: AgroUrbana
description: >-
  AgroUrbana SpA is a Chilean vertical-farming company founded in 2018 in Santiago by Pablo
  Bunster and Cristian Sjogren, and widely described as the first commercial vertical farm in
  Latin America. It runs climate-controlled indoor grow facilities combining hydroponics,
  spectrum-programmed LED lighting, renewable energy, automation and data analytics to produce
  leafy greens year round, reporting up to twelve growing cycles a year and up to 95% less water
  use than open-field agriculture. Produce is sold to Chilean retailers including Cencosud and
  Walmart Chile, and direct to consumers under the Urban Rabbit brand through a hosted online
  store. The company has raised roughly USD 12 million, including a USD 4 million Series A led by
  Kayyak Ventures and a USD 6 million pre-Series B led by ALB Inversiones. AgroUrbana operates
  its technology internally to run its own farms and publishes no public API, SDK, developer
  portal or machine-readable API contract.
